name: Update Portfolio Prices

on:
  schedule:
    # Run every hour during market hours (9am-5pm EST = 2pm-10pm UTC, Mon-Fri)
    - cron: '0 14-22 * * 1-5'
  workflow_dispatch:  # Allows manual trigger from Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Need this to push changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install yfinance pandas
        
    - name: Fetch latest prices
      run: |
        python auto_price_fetcher.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'github-actions@github.com'
        git add portfolio_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
