<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Competition Tracker</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(to bottom right, #020617, #0f172a, #020617);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #22d3ee, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .tab-active {
            border-bottom: 2px solid #22d3ee;
            color: #22d3ee;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // ============================================
        // ICONS
        // ============================================
        
        const TrendingUp = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const TrendingDown = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
        );

        const RefreshCw = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const Trophy = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
        );

        const Bitcoin = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const ArrowLeft = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        );

        const User = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        );
        
        // ============================================
        // DATA & UTILITIES
        // ============================================
        
        const portfolios = [
          { name: 'Heather', canada: 'PPL', us: 'NVDA', intl: 'DNNGY' },
          { name: 'Mason', canada: 'SHOP', us: 'NVDA', intl: 'DNNGY' },
          { name: 'Michael', canada: 'CSU', us: 'UNH', intl: 'ASML' },
          { name: 'Mark', canada: 'TOU', us: 'MSFT', intl: 'TSM' },
          { name: 'Beau', canada: 'AIF', us: 'BDX', intl: 'LVMUY' },
          { name: 'Marcus', canada: 'OTEX', us: 'UNH', intl: 'BAESY' },
          { name: 'Jestine', canada: 'CAE', us: 'ORCL', intl: 'SE' }
        ];
        
        const formatCurrency = (value) => {
          return new Intl.NumberFormat('en-CA', {
            style: 'currency',
            currency: 'CAD',
            minimumFractionDigits: 2
          }).format(value);
        };
        
        const formatPercent = (value) => {
          return `${value >= 0 ? '+' : ''}${(value * 100).toFixed(2)}%`;
        };
        
        const calculateReturn = (stock, priceData) => {
          if (!stock || !priceData) return 0;
          const priceReturn = (stock.current_price / stock.baseline_price) - 1;
          const dividendReturn = stock.dividends_since_baseline / stock.baseline_price;
          return priceReturn + dividendReturn;
        };
        
        const calculatePortfolioReturn = (portfolio, priceData) => {
          if (!priceData?.stocks) return 0;
          const canadaReturn = calculateReturn(priceData.stocks[portfolio.canada], priceData);
          const usReturn = calculateReturn(priceData.stocks[portfolio.us], priceData);
          const intlReturn = calculateReturn(priceData.stocks[portfolio.intl], priceData);
          return (canadaReturn + usReturn + intlReturn) / 3;
        };
        
        // ============================================
        // NAVIGATION COMPONENT
        // ============================================
        
        const Navigation = ({ currentView, setCurrentView, lastUpdate, onRefresh, loading }) => {
          return (
            <nav className="glass-card border-b border-slate-800 sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 py-4">
                <div className="flex items-center justify-between flex-wrap gap-4">
                  <div className="flex items-center gap-8">
                    <div className="text-2xl font-bold gradient-text cursor-pointer" onClick={() => setCurrentView('leaderboard')}>
                      📊 Portfolio Tracker
                    </div>
                    <div className="hidden md:flex gap-6">
                      <button
                        onClick={() => setCurrentView('leaderboard')}
                        className={`text-slate-300 hover:text-cyan-400 transition-colors pb-1 ${currentView === 'leaderboard' ? 'tab-active' : ''}`}
                      >
                        Leaderboard
                      </button>
                      <button
                        onClick={() => setCurrentView('investors')}
                        className={`text-slate-300 hover:text-cyan-400 transition-colors pb-1 ${currentView === 'investors' ? 'tab-active' : ''}`}
                      >
                        Investors
                      </button>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-4">
                    {lastUpdate && (
                      <span className="text-slate-500 text-sm hidden sm:block">
                        Updated: {lastUpdate.toLocaleString('en-CA', {
                          month: 'short',
                          day: 'numeric',
                          hour: '2-digit',
                          minute: '2-digit'
                        })}
                      </span>
                    )}
                    <button
                      onClick={onRefresh}
                      disabled={loading}
                      className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-all disabled:opacity-50"
                    >
                      <RefreshCw className={loading ? 'animate-spin' : ''} />
                      <span className="hidden sm:inline">Refresh</span>
                    </button>
                  </div>
                </div>
              </div>
            </nav>
          );
        };
        
        // ============================================
        // BITCOIN TRACKER
        // ============================================
        
        const BitcoinTracker = ({ bitcoin }) => {
          if (!bitcoin) return null;
          
          const bitcoinReturn = (bitcoin.current_price / bitcoin.baseline_price) - 1;
          const bitcoinValue = 700 * (1 + bitcoinReturn);
          
          return (
            <div className="glass-card rounded-xl p-6 border-orange-500/20 bg-gradient-to-br from-orange-500/10 to-yellow-500/10 fade-in">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <Bitcoin className="w-8 h-8 text-orange-400" />
                  <div>
                    <h3 className="text-xl font-bold text-orange-400">Bitcoin Prize Pool</h3>
                    <p className="text-slate-400 text-sm">$700 CAD invested on Sep 19</p>
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-3xl font-bold text-white">
                    {formatCurrency(bitcoinValue)}
                  </div>
                  <div className={`text-lg font-semibold ${bitcoinReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                    {formatPercent(bitcoinReturn)}
                  </div>
                </div>
              </div>
            </div>
          );
        };
        
        // ============================================
        // LEADERBOARD
        // ============================================
        
        const Leaderboard = ({ priceData, onViewInvestor }) => {
          const rankings = useMemo(() => {
            if (!priceData?.stocks) return [];
            
            const results = portfolios.map(portfolio => {
              const portfolioReturn = calculatePortfolioReturn(portfolio, priceData);
              const portfolioValue = 10000 * (1 + portfolioReturn);
              
              return {
                ...portfolio,
                portfolioReturn,
                portfolioValue,
                canadaReturn: calculateReturn(priceData.stocks[portfolio.canada], priceData),
                usReturn: calculateReturn(priceData.stocks[portfolio.us], priceData),
                intlReturn: calculateReturn(priceData.stocks[portfolio.intl], priceData)
              };
            });
            
            results.sort((a, b) => b.portfolioReturn - a.portfolioReturn);
            results.forEach((r, i) => r.rank = i + 1);
            
            return results;
          }, [priceData]);
          
          const getRankBadge = (rank) => {
            const badges = {
              1: 'bg-gradient-to-br from-yellow-400 to-orange-500 text-slate-900',
              2: 'bg-gradient-to-br from-slate-400 to-slate-500 text-slate-900',
              3: 'bg-gradient-to-br from-amber-600 to-amber-700 text-white'
            };
            return badges[rank] || 'bg-slate-800 text-slate-400';
          };
          
          return (
            <div className="max-w-7xl mx-auto px-4 py-8 fade-in">
              <div className="mb-8">
                <h1 className="text-5xl font-bold gradient-text mb-2">
                  Portfolio Competition
                </h1>
                <p className="text-slate-400 text-lg">
                  Live tracking since September 19, 2024
                </p>
              </div>
              
              <div className="mb-8">
                <BitcoinTracker bitcoin={priceData?.bitcoin} />
              </div>
              
              <div className="glass-card rounded-2xl overflow-hidden border-slate-800">
                <div className="p-6 border-b border-slate-800 bg-gradient-to-r from-slate-800 to-slate-900">
                  <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                    <Trophy className="w-6 h-6 text-yellow-400" />
                    Leaderboard
                  </h2>
                </div>
                
                <div className="overflow-x-auto">
                  <table className="w-full">
                    <thead>
                      <tr className="border-b border-slate-800">
                        <th className="px-6 py-4 text-left text-sm font-semibold text-slate-400 uppercase">Rank</th>
                        <th className="px-6 py-4 text-left text-sm font-semibold text-slate-400 uppercase">Investor</th>
                        <th className="px-6 py-4 text-center text-sm font-semibold text-slate-400 uppercase">Canada</th>
                        <th className="px-6 py-4 text-center text-sm font-semibold text-slate-400 uppercase">U.S.</th>
                        <th className="px-6 py-4 text-center text-sm font-semibold text-slate-400 uppercase">International</th>
                        <th className="px-6 py-4 text-right text-sm font-semibold text-slate-400 uppercase">Return</th>
                        <th className="px-6 py-4 text-right text-sm font-semibold text-slate-400 uppercase">Value</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rankings.map((inv) => (
                        <tr
                          key={inv.name}
                          onClick={() => onViewInvestor(inv.name)}
                          className={`border-b border-slate-800 hover:bg-slate-800/30 transition-all cursor-pointer ${
                            inv.rank === 1 ? 'bg-gradient-to-r from-yellow-500/5 to-transparent' : ''
                          }`}
                        >
                          <td className="px-6 py-4">
                            <div className={`flex items-center justify-center w-10 h-10 rounded-full font-bold ${getRankBadge(inv.rank)}`}>
                              {inv.rank}
                            </div>
                          </td>
                          <td className="px-6 py-4">
                            <div className="font-semibold text-white flex items-center gap-2">
                              {inv.name}
                              {inv.rank === 1 && <Trophy className="w-4 h-4 text-yellow-400" />}
                            </div>
                          </td>
                          <td className="px-6 py-4 text-center">
                            <div className="text-slate-300 text-sm font-mono font-semibold">{inv.canada}</div>
                            <div className={`text-xs font-semibold ${inv.canadaReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                              {formatPercent(inv.canadaReturn)}
                            </div>
                          </td>
                          <td className="px-6 py-4 text-center">
                            <div className="text-slate-300 text-sm font-mono font-semibold">{inv.us}</div>
                            <div className={`text-xs font-semibold ${inv.usReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                              {formatPercent(inv.usReturn)}
                            </div>
                          </td>
                          <td className="px-6 py-4 text-center">
                            <div className="text-slate-300 text-sm font-mono font-semibold">{inv.intl}</div>
                            <div className={`text-xs font-semibold ${inv.intlReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                              {formatPercent(inv.intlReturn)}
                            </div>
                          </td>
                          <td className="px-6 py-4 text-right">
                            <div className={`flex items-center justify-end gap-2 font-bold text-lg ${
                              inv.portfolioReturn >= 0 ? 'text-green-400' : 'text-red-400'
                            }`}>
                              {inv.portfolioReturn >= 0 ? <TrendingUp /> : <TrendingDown />}
                              {formatPercent(inv.portfolioReturn)}
                            </div>
                          </td>
                          <td className="px-6 py-4 text-right">
                            <div className="font-semibold text-white text-lg font-mono">
                              {formatCurrency(inv.portfolioValue)}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              
              <div className="mt-8 text-center text-slate-500 text-sm">
                <p>Equal-weighted portfolios starting at $10,000 CAD • Returns include dividends</p>
                <p className="mt-2">Click any investor to see detailed breakdown</p>
              </div>
            </div>
          );
        };
        
        // ============================================
        // INVESTOR DETAIL
        // ============================================
        
        const InvestorDetail = ({ investorName, priceData, onBack }) => {
          const investor = portfolios.find(p => p.name === investorName);
          
          if (!investor || !priceData?.stocks) {
            return null;
          }
          
          const portfolioReturn = calculatePortfolioReturn(investor, priceData);
          const portfolioValue = 10000 * (1 + portfolioReturn);
          
          const getStockDetails = (ticker) => {
            const stock = priceData.stocks[ticker];
            if (!stock) return null;
            
            const shares = 3333.33 / stock.baseline_price;
            const currentValue = shares * stock.current_price;
            const gainLoss = currentValue - 3333.33;
            const returnPct = calculateReturn(stock, priceData);
            const dividendsEarned = shares * stock.dividends_since_baseline;
            
            return {
              ticker,
              shares,
              purchasePrice: stock.baseline_price,
              currentPrice: stock.current_price,
              currentValue,
              gainLoss,
              returnPct,
              dividendsEarned
            };
          };
          
          const stocks = [
            { ...getStockDetails(investor.canada), type: 'Canadian' },
            { ...getStockDetails(investor.us), type: 'U.S.' },
            { ...getStockDetails(investor.intl), type: 'International' }
          ];
          
          const rank = portfolios
            .map(p => ({ ...p, return: calculatePortfolioReturn(p, priceData) }))
            .sort((a, b) => b.return - a.return)
            .findIndex(p => p.name === investor.name) + 1;
          
          return (
            <div className="max-w-7xl mx-auto px-4 py-8 fade-in">
              <button
                onClick={onBack}
                className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 mb-6 transition-colors"
              >
                <ArrowLeft className="w-5 h-5" />
                Back to Leaderboard
              </button>
              
              <div className="mb-8">
                <div className="flex items-center justify-between flex-wrap gap-4">
                  <div>
                    <h1 className="text-5xl font-bold gradient-text mb-2">{investor.name}</h1>
                    <p className="text-slate-400">Portfolio Breakdown</p>
                  </div>
                  <div className="text-right">
                    <div className="text-4xl font-bold text-cyan-400">#{rank}</div>
                    <div className="text-slate-500 text-sm">Current Rank</div>
                  </div>
                </div>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div className="glass-card rounded-xl p-6 border-slate-800">
                  <div className="text-slate-400 text-sm mb-2">Portfolio Value</div>
                  <div className="text-2xl font-bold text-white font-mono">{formatCurrency(portfolioValue)}</div>
                </div>
                <div className="glass-card rounded-xl p-6 border-slate-800">
                  <div className="text-slate-400 text-sm mb-2">Total Return</div>
                  <div className={`text-2xl font-bold font-mono ${portfolioReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                    {formatPercent(portfolioReturn)}
                  </div>
                </div>
                <div className="glass-card rounded-xl p-6 border-slate-800">
                  <div className="text-slate-400 text-sm mb-2">Gain/Loss</div>
                  <div className={`text-2xl font-bold font-mono ${portfolioValue >= 10000 ? 'text-green-400' : 'text-red-400'}`}>
                    {formatCurrency(portfolioValue - 10000)}
                  </div>
                </div>
                <div className="glass-card rounded-xl p-6 border-slate-800">
                  <div className="text-slate-400 text-sm mb-2">Rank</div>
                  <div className="text-2xl font-bold text-cyan-400">#{rank} of 7</div>
                </div>
              </div>
              
              <h2 className="text-2xl font-bold text-white mb-4">Holdings Details</h2>
              
              <div className="grid grid-cols-1 gap-6">
                {stocks.map((stock) => stock && (
                  <div key={stock.ticker} className="glass-card rounded-xl p-6 border-slate-800">
                    <div className="flex items-start justify-between flex-wrap gap-4 mb-4">
                      <div>
                        <div className="text-2xl font-bold text-white font-mono mb-1">{stock.ticker}</div>
                        <div className="text-slate-400">{stock.type} Stock</div>
                      </div>
                      <div className={`text-2xl font-bold ${stock.returnPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                        {formatPercent(stock.returnPct)}
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div>
                        <div className="text-slate-500 text-sm">Purchase Price</div>
                        <div className="text-white font-mono">{formatCurrency(stock.purchasePrice)}</div>
                      </div>
                      <div>
                        <div className="text-slate-500 text-sm">Current Price</div>
                        <div className="text-white font-mono">{formatCurrency(stock.currentPrice)}</div>
                      </div>
                      <div>
                        <div className="text-slate-500 text-sm">Shares Owned</div>
                        <div className="text-white font-mono">{stock.shares.toFixed(2)}</div>
                      </div>
                      <div>
                        <div className="text-slate-500 text-sm">Current Value</div>
                        <div className="text-white font-mono">{formatCurrency(stock.currentValue)}</div>
                      </div>
                      <div>
                        <div className="text-slate-500 text-sm">Gain/Loss</div>
                        <div className={`font-mono ${stock.gainLoss >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                          {formatCurrency(stock.gainLoss)}
                        </div>
                      </div>
                      <div>
                        <div className="text-slate-500 text-sm">Dividends Earned</div>
                        <div className="text-cyan-400 font-mono">{formatCurrency(stock.dividendsEarned)}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        };
        
        // ============================================
        // INVESTORS LIST VIEW
        // ============================================
        
        const InvestorsList = ({ priceData, onViewInvestor }) => {
          const rankings = useMemo(() => {
            if (!priceData?.stocks) return [];
            
            const results = portfolios.map(portfolio => {
              const portfolioReturn = calculatePortfolioReturn(portfolio, priceData);
              const portfolioValue = 10000 * (1 + portfolioReturn);
              
              return {
                ...portfolio,
                portfolioReturn,
                portfolioValue
              };
            });
            
            results.sort((a, b) => b.portfolioReturn - a.portfolioReturn);
            results.forEach((r, i) => r.rank = i + 1);
            
            return results;
          }, [priceData]);
          
          return (
            <div className="max-w-7xl mx-auto px-4 py-8 fade-in">
              <h1 className="text-4xl font-bold gradient-text mb-8">All Investors</h1>
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {rankings.map((inv) => (
                  <div
                    key={inv.name}
                    onClick={() => onViewInvestor(inv.name)}
                    className="glass-card rounded-xl p-6 border-slate-800 cursor-pointer hover:border-cyan-500/50 transition-all hover:scale-105"
                  >
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center gap-3">
                        <User className="w-10 h-10 text-cyan-400" />
                        <div>
                          <div className="text-xl font-bold text-white">{inv.name}</div>
                          <div className="text-slate-500 text-sm">Rank #{inv.rank}</div>
                        </div>
                      </div>
                      {inv.rank === 1 && <Trophy className="w-6 h-6 text-yellow-400" />}
                    </div>
                    
                    <div className="space-y-2">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Portfolio Value</span>
                        <span className="text-white font-mono font-semibold">{formatCurrency(inv.portfolioValue)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Return</span>
                        <span className={`font-mono font-semibold ${inv.portfolioReturn >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                          {formatPercent(inv.portfolioReturn)}
                        </span>
                      </div>
                    </div>
                    
                    <div className="mt-4 pt-4 border-t border-slate-700">
                      <div className="text-slate-500 text-sm mb-2">Holdings</div>
                      <div className="flex gap-2">
                        <span className="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300 font-mono">{inv.canada}</span>
                        <span className="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300 font-mono">{inv.us}</span>
                        <span className="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300 font-mono">{inv.intl}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        };
        
        // ============================================
        // MAIN APP
        // ============================================
        
        const App = () => {
          const [data, setData] = useState(null);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);
          const [lastUpdate, setLastUpdate] = useState(null);
          const [currentView, setCurrentView] = useState('leaderboard'); // 'leaderboard', 'investors', or investor name
          const [selectedInvestor, setSelectedInvestor] = useState(null);

          const fetchData = async () => {
            setLoading(true);
            try {
              const response = await fetch('./portfolio_data.json?t=' + Date.now());
              if (!response.ok) throw new Error('Failed to fetch data');
              const json = await response.json();
              setData(json);
              setLastUpdate(new Date(json.last_updated));
              setError(null);
            } catch (err) {
              setError(err.message);
            } finally {
              setLoading(false);
            }
          };

          useEffect(() => {
            fetchData();
            const interval = setInterval(fetchData, 300000); // 5 minutes
            return () => clearInterval(interval);
          }, []);

          const handleViewInvestor = (name) => {
            setSelectedInvestor(name);
            setCurrentView('detail');
          };

          const handleBack = () => {
            setSelectedInvestor(null);
            setCurrentView('leaderboard');
          };

          if (error) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
                <div className="glass-card rounded-xl p-8 max-w-md text-center">
                  <h2 className="text-2xl font-bold text-red-400 mb-4">Error Loading Data</h2>
                  <p className="text-slate-400 mb-6">{error}</p>
                  <button
                    onClick={fetchData}
                    className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-all"
                  >
                    Retry
                  </button>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
              <div className="fixed inset-0 opacity-10" style={{
                backgroundImage: `linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                                 linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px)`,
                backgroundSize: '50px 50px'
              }} />
              
              <div className="relative z-10">
                <Navigation 
                  currentView={currentView} 
                  setCurrentView={setCurrentView}
                  lastUpdate={lastUpdate} 
                  onRefresh={fetchData} 
                  loading={loading} 
                />
                
                {currentView === 'leaderboard' && (
                  <Leaderboard priceData={data} onViewInvestor={handleViewInvestor} />
                )}
                
                {currentView === 'investors' && (
                  <InvestorsList priceData={data} onViewInvestor={handleViewInvestor} />
                )}
                
                {currentView === 'detail' && selectedInvestor && (
                  <InvestorDetail 
                    investorName={selectedInvestor} 
                    priceData={data} 
                    onBack={handleBack}
                  />
                )}
              </div>
            </div>
          );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
